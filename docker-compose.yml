version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: upi_sentinel_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-upi_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-upi_password_2026}
      POSTGRES_DB: ${POSTGRES_DB:-upi_fraud_db}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-upi_user} -d ${POSTGRES_DB:-upi_fraud_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: upi_sentinel_backend
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-upi_user}:${POSTGRES_PASSWORD:-upi_password_2026}@db:5432/${POSTGRES_DB:-upi_fraud_db}
      JWT_SECRET: ${JWT_SECRET:-upi_sentinel_super_secret_hackathon_key_2026_xyz}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend/models:/app/backend/models
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: upi_sentinel_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
